services:
  postgres:
    image: postgres:16-alpine
    container_name: career-website-db
    restart: unless-stopped
    env_file: .env
    # Bound to loopback only — never reachable from the public internet, even
    # though the droplet has a public IP. Reach it for one-off tasks (like
    # seeding) via an SSH tunnel from your machine; see docs/DEPLOYMENT.md.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/briswells/brianwells-org:latest
    container_name: brianwells-org
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to loopback only. The droplet has a public IP — without this the
    # app is reachable at http://<droplet-ip>:3000 directly, bypassing
    # Cloudflare Access and Turnstile entirely. Cloudflare Tunnel (cloudflared,
    # installed as a separate systemd service, not in this compose file)
    # reaches it over this same loopback interface.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
